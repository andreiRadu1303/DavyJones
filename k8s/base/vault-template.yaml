# Template for per-user vault infrastructure.
# The Central API creates these resources in namespace dj-{user_id}
# when a user registers a vault. Variables in ${} are replaced at creation time.
#
# Usage: the Central API reads this template, substitutes variables,
# and applies it via the Kubernetes API.

---
# Persistent volume for vault git clone
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-${VAULT_SLUG}
  namespace: dj-${USER_ID}
  labels:
    app: davyjones
    vault: ${VAULT_SLUG}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi

---
# Persistent volume for dispatcher state (reports, .last_sha)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: state-${VAULT_SLUG}
  namespace: dj-${USER_ID}
  labels:
    app: davyjones
    vault: ${VAULT_SLUG}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi

---
# User credentials (Claude key, MCP tokens)
apiVersion: v1
kind: Secret
metadata:
  name: vault-credentials-${VAULT_SLUG}
  namespace: dj-${USER_ID}
type: Opaque
stringData:
  CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_TOKEN}"
  GITHUB_TOKEN: "${GITHUB_TOKEN}"
  GITLAB_TOKEN: "${GITLAB_TOKEN}"
  SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
  SLACK_APP_TOKEN: "${SLACK_APP_TOKEN}"

---
# Per-vault config (rules JSON + non-secret env overrides like GITLAB_API_URL).
# Cloud API patches this on every save; mounted into dispatcher and into MCP
# Deployments that need overrides. Mounted ConfigMap files live-update without
# pod restart, so most config changes propagate without a rollout.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config-${VAULT_SLUG}
  namespace: dj-${USER_ID}
  labels:
    app: davyjones
    vault: ${VAULT_SLUG}
data:
  rules.json: "{}"
  GITLAB_API_URL: "https://gitlab.com"

---
# Dispatcher deployment (1 per vault)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcher-${VAULT_SLUG}
  namespace: dj-${USER_ID}
  labels:
    app: davyjones
    component: dispatcher
    vault: ${VAULT_SLUG}
spec:
  replicas: ${REPLICAS}  # 0 for free (cold start), 1 for pro (warm)
  # ReadWriteOnce PVCs can only mount one pod at a time — RollingUpdate would
  # deadlock waiting for the old pod to release the volume. Recreate kills the
  # old pod first, briefly leaving 0 replicas; tasks/proxy hits during this
  # window get a 503 ("Dispatcher not running"), already handled by the API.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: davyjones
      component: dispatcher
      vault: ${VAULT_SLUG}
  template:
    metadata:
      labels:
        app: davyjones
        component: dispatcher
        vault: ${VAULT_SLUG}
    spec:
      serviceAccountName: dispatcher
      initContainers:
      # Clone vault from Forgejo on startup
      - name: git-sync
        image: alpine/git:latest
        command:
        - sh
        - -c
        - |
          if [ -d /vault/.git ]; then
            cd /vault && git pull --rebase origin main || true
          elif [ -z "$(ls -A /vault 2>/dev/null)" ]; then
            git clone ${GIT_REPO_URL} /vault || true
          else
            cd /vault && git init && git remote add origin ${GIT_REPO_URL} && git fetch && git checkout -b main origin/main || true
          fi
          chown -R 501:20 /vault 2>/dev/null || true
        volumeMounts:
        - name: vault
          mountPath: /vault
      containers:
      - name: dispatcher
        image: europe-west1-docker.pkg.dev/central-surf-270818/davyjones/dispatcher:latest
        ports:
        - containerPort: 5555
        envFrom:
        - secretRef:
            name: vault-credentials-${VAULT_SLUG}
        env:
        - name: VAULT_PATH
          value: /vault
        - name: RUNTIME_BACKEND
          value: k8s
        - name: K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: K8S_AGENT_IMAGE
          value: europe-west1-docker.pkg.dev/central-surf-270818/davyjones/agent:latest
        - name: DISPATCHER_HOSTNAME
          value: dispatcher-${VAULT_SLUG}
        - name: VAULT_SLUG
          value: ${VAULT_SLUG}
        - name: DOCKER_NETWORK
          value: ""
        - name: HTTP_PORT
          value: "5555"
        - name: REDIS_URL
          value: redis://redis.davyjones-system:6379/0
        volumeMounts:
        - name: vault
          mountPath: /vault
        - name: state
          mountPath: /app/state
        - name: vault-config
          mountPath: /vault-config
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: vault
        persistentVolumeClaim:
          claimName: vault-${VAULT_SLUG}
      - name: state
        persistentVolumeClaim:
          claimName: state-${VAULT_SLUG}
      - name: vault-config
        configMap:
          name: vault-config-${VAULT_SLUG}

---
# Dispatcher service (internal, Central API proxies to this)
apiVersion: v1
kind: Service
metadata:
  name: dispatcher-${VAULT_SLUG}
  namespace: dj-${USER_ID}
spec:
  selector:
    app: davyjones
    component: dispatcher
    vault: ${VAULT_SLUG}
  ports:
  - port: 5555

---
# Obsidian MCP (read-only vault access for agents)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obsidian-mcp-${VAULT_SLUG}
  namespace: dj-${USER_ID}
  labels:
    app: davyjones
    component: obsidian-mcp
    vault: ${VAULT_SLUG}
spec:
  replicas: ${REPLICAS}
  selector:
    matchLabels:
      app: davyjones
      component: obsidian-mcp
      vault: ${VAULT_SLUG}
  template:
    metadata:
      labels:
        app: davyjones
        component: obsidian-mcp
        vault: ${VAULT_SLUG}
    spec:
      containers:
      - name: obsidian-mcp
        image: europe-west1-docker.pkg.dev/central-surf-270818/davyjones/obsidian-mcp:latest
        ports:
        - containerPort: 3010
        volumeMounts:
        - name: vault
          mountPath: /vault
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
      volumes:
      - name: vault
        persistentVolumeClaim:
          claimName: vault-${VAULT_SLUG}

---
apiVersion: v1
kind: Service
metadata:
  name: obsidian-mcp-${VAULT_SLUG}
  namespace: dj-${USER_ID}
spec:
  selector:
    app: davyjones
    component: obsidian-mcp
    vault: ${VAULT_SLUG}
  ports:
  - port: 3010

---
# DavyJones MCP (vault file ops + memory)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: davyjones-mcp-${VAULT_SLUG}
  namespace: dj-${USER_ID}
  labels:
    app: davyjones
    component: davyjones-mcp
    vault: ${VAULT_SLUG}
spec:
  replicas: ${REPLICAS}
  selector:
    matchLabels:
      app: davyjones
      component: davyjones-mcp
      vault: ${VAULT_SLUG}
  template:
    metadata:
      labels:
        app: davyjones
        component: davyjones-mcp
        vault: ${VAULT_SLUG}
    spec:
      containers:
      - name: davyjones-mcp
        image: europe-west1-docker.pkg.dev/central-surf-270818/davyjones/davyjones-mcp:latest
        ports:
        - containerPort: 3004
        env:
        - name: VAULT_PATH
          value: /vault
        volumeMounts:
        - name: vault
          mountPath: /vault
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
      volumes:
      - name: vault
        persistentVolumeClaim:
          claimName: vault-${VAULT_SLUG}
---
apiVersion: v1
kind: Service
metadata:
  name: davyjones-mcp-${VAULT_SLUG}
  namespace: dj-${USER_ID}
spec:
  selector:
    app: davyjones
    component: davyjones-mcp
    vault: ${VAULT_SLUG}
  ports:
  - port: 3004

---
# GitLab MCP (public image; supports custom GITLAB_API_URL for self-hosted)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-mcp-${VAULT_SLUG}
  namespace: dj-${USER_ID}
  labels:
    app: davyjones
    component: gitlab-mcp
    vault: ${VAULT_SLUG}
spec:
  # Token-dependent MCPs default to 0; cloud scales to 1 once a token is set.
  # Otherwise the container crash-loops on "TOKEN not set".
  replicas: 0
  selector:
    matchLabels:
      app: davyjones
      component: gitlab-mcp
      vault: ${VAULT_SLUG}
  template:
    metadata:
      labels:
        app: davyjones
        component: gitlab-mcp
        vault: ${VAULT_SLUG}
    spec:
      containers:
      - name: gitlab-mcp
        image: zereight050/gitlab-mcp:latest
        ports:
        - containerPort: 3002
        env:
        - name: GITLAB_PERSONAL_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: vault-credentials-${VAULT_SLUG}
              key: GITLAB_TOKEN
        - name: GITLAB_API_URL
          valueFrom:
            configMapKeyRef:
              name: vault-config-${VAULT_SLUG}
              key: GITLAB_API_URL
        - name: SSE
          value: "true"
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "3002"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-mcp-${VAULT_SLUG}
  namespace: dj-${USER_ID}
spec:
  selector:
    app: davyjones
    component: gitlab-mcp
    vault: ${VAULT_SLUG}
  ports:
  - port: 3002

